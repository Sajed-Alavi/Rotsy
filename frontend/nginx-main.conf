# Top-level nginx config, copied over whatever the installed nginx package
# wrote to /etc/nginx/nginx.conf.
#
# Switching to Alpine's own nginx package (see Dockerfile — needed to get
# CVE-patched package revisions nginx.org's repo doesn't carry) overwrote this
# file with Alpine's own default, which does not wrap
# `include /etc/nginx/conf.d/*.conf;` inside an `http {}` block the way
# nginx.org's build's default did — so the `server {}` in our
# conf.d/default.conf (envsubst'd from nginx.conf's template) landed outside
# any http block: "server directive is not allowed here". Shipping this file
# ourselves means the top-level structure no longer depends on which package
# happened to provide the nginx binary.
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}

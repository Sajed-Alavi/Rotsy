# =============================================================================
# Nexus Repository Manager — Advanced Web Wrapper (v2 stack)
# -----------------------------------------------------------------------------
# Services: postgres (persistence), redis (cache), backend (FastAPI),
#           frontend (React SPA via nginx).
#
#     cp .env.example .env   # then edit values
#     docker compose up --build
#
# All containers read the same ".env" via env_file (single source of truth).
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - nexus-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - nexus-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Compose-network overrides (service hostnames, not localhost).
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      # Air-gapped scanner DB import: operator drops db archives into ./offline-db
      # on the host; the container reads them from /app/offline-db.
      - SCANNER_OFFLINE_DIR=/app/offline-db
    volumes:
      # Pre-downloaded Trivy/Grype DB archives for offline import (restricted
      # networks). Create ./offline-db and drop db.tar.gz / grype-db.tar.gz in.
      - ./offline-db:/app/offline-db:ro
      # Persist the scanner vulnerability DBs across rebuilds/recreates so the
      # (large: trivy ~1.2GB, grype ~1.9GB) databases are NOT wiped and
      # re-downloaded every `docker compose up --build`.
      - scanner-cache:/app/.cache
    # Lets the container reach services on the Docker host (e.g. Nexus on :8081).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    networks:
      - nexus-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BACKEND_UPSTREAM=backend:${BACKEND_PORT}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - nexus-net

networks:
  nexus-net:
    driver: bridge

volumes:
  pg-data:
  redis-data:
  scanner-cache:

# nginx config for the SPA + /api reverse proxy.
#
# The official nginx image runs envsubst on files in /etc/nginx/templates at
# container start, substituting ${VAR} references. BACKEND_UPSTREAM is injected
# via docker-compose (e.g. "backend:8000").

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA history fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy /api to the FastAPI backend on the compose network.
    # `http.request` is preserved; SSE responses stream through unchanged
    # because we disable proxy_buffering and keep the connection upgraded.
    location /api/ {
        proxy_pass http://${BACKEND_UPSTREAM}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: don't buffer, allow long-lived streams.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }

    # Gzip static assets.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

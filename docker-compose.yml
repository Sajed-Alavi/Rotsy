# =============================================================================
# Rotsy — management and image-scanning console for Sonatype Nexus
# -----------------------------------------------------------------------------
# Services: postgres (persistence), redis (cache + job queue), backend
#           (FastAPI + Trivy/Grype), frontend (React SPA via nginx).
#
#     cp .env.example .env   # then edit values
#     docker compose up --build
#
# All containers read the same ".env" via env_file (single source of truth).
#
# NOTE — no Docker socket is mounted anywhere in this file, and that is
# deliberate. Image scanning is static: the scanners read manifests and layer
# blobs over the registry API and never start a container. Mounting
# /var/run/docker.sock would both break that guarantee and hand the backend
# root on the host.
# =============================================================================

services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - nexus-net

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - nexus-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Explicit: without this, Docker defaults to the *last* stage in the
      # Dockerfile, which since the `test` stage was appended is no longer
      # `base` — an unpinned target here would silently build (and run) the
      # pytest image instead of the app.
      target: base
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Compose-network overrides (service hostnames, not localhost).
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      # Air-gapped scanner DB import: operator drops db archives into ./offline-db
      # on the host; the container reads them from /app/offline-db.
      - SCANNER_OFFLINE_DIR=/app/offline-db
      # Grype's download deadlines. Its 5m default cannot fetch a ~139 MB
      # database over a slow link, and it aborts with a misleading
      # "unexpected EOF". The image sets sane defaults; these let .env win.
      - GRYPE_DB_UPDATE_DOWNLOAD_TIMEOUT=${GRYPE_DB_UPDATE_DOWNLOAD_TIMEOUT:-45m}
      - GRYPE_DB_UPDATE_AVAILABLE_TIMEOUT=${GRYPE_DB_UPDATE_AVAILABLE_TIMEOUT:-2m}
      # Where full/selective backup archive runs are written.
      - BACKUP_OUTPUT_DIR=/app/backups
    volumes:
      # Pre-downloaded Trivy/Grype DB archives for offline import (restricted
      # networks). Create ./offline-db and drop db.tar.gz / grype-db.tar.gz in.
      - ./offline-db:/app/offline-db:ro
      # Persist the scanner vulnerability DBs across rebuilds/recreates so the
      # (large: trivy ~1.2GB, grype ~1.9GB) databases are NOT wiped and
      # re-downloaded every `docker compose up --build`.
      - scanner-cache:/app/.cache
      # Dedicated volume for backup/archive runs (full or selective) — survives
      # rebuilds/recreates like scanner-cache, since these are operator-facing
      # archives, not disposable cache.
      - backup-data:/app/backups
    # Lets the container reach services on the Docker host: the Nexus REST API
    # (:8081) and every Docker connector port discovery finds, whatever they are.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Published so Nexus (which runs on the host network) can deliver push
    # webhooks to http://localhost:${BACKEND_PORT}/api/scan/events/nexus.
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    networks:
      - nexus-net

  # Runs the pytest suite (backend/tests/) against the `test` build stage
  # (see backend/Dockerfile), which adds pytest/pytest-asyncio/aiosqlite on
  # top of the runtime image. No Postgres/Redis needed — tests build their
  # own Settings explicitly and use an in-memory SQLite DB (see
  # backend/tests/conftest.py), so this needs no env_file, network, or
  # depends_on. Gated behind the `test` profile so it never starts with a
  # plain `docker compose up`.
  #
  #   docker compose --profile test run --rm backend-test
  #
  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    profiles:
      - test

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BACKEND_UPSTREAM=backend:${BACKEND_PORT}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:8080"
    networks:
      - nexus-net

networks:
  nexus-net:
    driver: bridge

volumes:
  pg-data:
  redis-data:
  scanner-cache:
  backup-data:
